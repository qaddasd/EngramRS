[package]
name = "engram-rs"
version = "0.3.0"
edition = "2021"
rust-version = "1.81"

[lib]
name = "engram_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
ahash = "0.8"
faer = "0.19"
half = "2.4"
numpy = "0.22"
pyo3 = { version = "0.22", features = ["extension-module"] }
rayon = "1.10"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
